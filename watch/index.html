<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three builds in 35 seconds · Anmol Bhandohal</title>
<meta name="description" content="A 35-second film of three measured builds: a music-reactive LED lamp, an ESP32 room-temperature study, and a Python tool that counts electrical fixtures off drawings. Then the 12-slide deck.">
<meta property="og:title" content="Three builds in 35 seconds · Anmol Bhandohal">
<meta property="og:description" content="Watch the 35-second film, then open the 12-slide deck.">
<meta property="og:image" content="https://anmol-portfolio-omega.vercel.app/media/lamp-anim-poster.jpg?v=5435665">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#11100e">
<link rel="canonical" href="https://anmol-portfolio-omega.vercel.app/watch/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2311100e'/><circle cx='16' cy='16' r='7' fill='%23c4834f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/museum.css">
<style>
  /* One path: 1 watch, 2 open the deck. Nothing else competes for the click. */
  .w{--pad:clamp(12px,2.5vw,40px);--film:calc((100svh - 195px) * 16 / 9);max-width:min(1720px, calc(var(--film) + 2 * var(--pad)));margin:0 auto;padding:clamp(12px,2.2vh,26px) var(--pad) 18px;display:grid;gap:clamp(12px,1.8vh,20px) 40px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "steps" "film" "cta" "foot";position:relative;z-index:1}
  .head{grid-area:head}
  .w-name{font:500 14px var(--sans);color:var(--ink-3);margin:0 0 6px}
  .w-name b{color:var(--ink);font-weight:500}
  .w h1{white-space:nowrap;font:400 clamp(24px,2.2vw,40px)/1.06 var(--serif);letter-spacing:-.01em;margin:0}

  .steps{grid-area:steps;display:flex;align-items:center;gap:12px;margin:0;font:500 clamp(14px,1.1vw,17px) var(--sans);color:var(--ink-3);flex-wrap:wrap}
  .step{display:inline-flex;align-items:center;gap:10px;transition:color .3s var(--ease)}
  .step b{font-weight:500}
  .step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid currentColor;font:500 13px var(--mono);flex:none}
  .step.on{color:var(--ink)} .step.on i{background:var(--copper);border-color:var(--copper);color:var(--on-acc)}
  .step.done{color:var(--ink-3)} .step.done i{border-style:solid;color:var(--ink-3)}
  .steps .arrow{color:var(--ink-3)}

  .player{grid-area:film;position:relative;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);margin:0}
  .player video{width:100%;aspect-ratio:16/9;display:block;background:#000}
  .cover{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:rgba(8,7,6,.8);color:var(--ink);font-family:var(--sans)}
  .cover:hover{background:rgba(8,7,6,.72)}
  .cover[hidden],.after[hidden],.below[hidden]{display:none}
  .cover-in{display:grid;justify-items:center;gap:16px}
  .disc{display:grid;place-items:center;width:clamp(76px,10vw,116px);height:clamp(76px,10vw,116px);border-radius:50%;background:var(--copper);color:var(--on-acc)}
  .disc svg{width:38%;height:38%;margin-left:7%}
  .cover b{font:500 clamp(19px,2.2vw,26px) var(--sans)}
  .cover span.sub{font:400 14px var(--mono);color:var(--ink-2)}

  .after{position:absolute;inset:0;display:grid;place-items:center;background:#0c0b09;text-align:center;padding:20px}
  .after-in{display:grid;justify-items:center;gap:16px}
  .after p{margin:0;font:400 clamp(17px,2vw,22px) var(--sans);color:var(--ink-2)}
  .again{background:none;border:0;color:var(--ink-3);font:400 14px var(--mono);cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:6px}
  .again:hover{color:var(--ink)}

  .deck{display:inline-flex;align-items:center;gap:12px;text-decoration:none;border-radius:11px;font:500 clamp(17px,1.9vw,20px) var(--sans);padding:16px 24px;border:1px solid var(--line);color:var(--ink-2);transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease)}
  .deck.go{background:var(--copper);border-color:transparent;color:var(--on-acc)}
  .deck:hover{border-color:var(--copper)}
  .deck svg{width:18px;height:18px;flex:none}
  .below{grid-area:cta;display:grid;justify-items:start;gap:10px;margin:0}
  .below small{font:400 13px var(--mono);color:var(--ink-3)}
  .foot{grid-area:foot;margin:0;padding-top:16px;border-top:1px solid var(--line);font:400 13px var(--sans);color:var(--ink-3)}
  .foot a{color:var(--ink-2)} .foot b{color:var(--ink-2);font-weight:500}
  @media(min-width:980px) and (max-width:1249px){
    .w{--film:calc((100svh - 245px) * 16 / 9)}
    .w.w{grid-template-areas:"head head" "steps steps" "film film" "cta foot"}
    .w .steps{justify-self:start}
  }
  @media(max-width:979px){.deck{width:100%;justify-content:center}.foot{order:9}}
  /* The film is the page: the column is as wide as the window allows while the whole 16:9 frame, the
     one-line header and the deck button still fit on one screen, so it reads well without full-screen. */
  @media(min-width:980px){
    .w{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"head steps" "film film" "cta foot";align-items:center}
    .steps{flex-wrap:nowrap;white-space:nowrap}
    .steps{justify-self:end}
    .below{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
    .foot{border-top:0;padding-top:0;justify-self:end;text-align:right}
  }
</style>
</head>
<body>
<main class="w">
  <div class="head">
    <h1>Three builds, measured</h1>
  </div>

  <div class="steps" aria-label="What to do on this page">
    <span class="step on" id="s1"><i>1</i><b>Watch the film · 35 s</b></span>
    <span class="arrow" aria-hidden="true">→</span>
    <span class="step" id="s2"><i>2</i><b>Then open the deck</b></span>
  </div>

  <div class="player">
    <video id="v" playsinline preload="auto" poster="/media/lamp-anim-poster.jpg?v=5435665" src="/media/lamp-anim.mp4?v=5435665"
           aria-label="35-second film: a music-reactive lamp, an ESP32 room study, and a Python tool that counts electrical fixtures"></video>
    <button class="cover" id="cover" aria-label="Play the 35-second film with sound">
      <span class="cover-in">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
        <b>Play the film</b>
        <span class="sub">35 seconds · with sound</span>
      </span>
    </button>
    <div class="after" id="after" hidden>
      <div class="after-in">
        <p>That was the short version.</p>
        <a class="deck go" href="/docs/files/Projects_Deck.pdf" target="_blank" rel="noopener">Open the 12-slide deck
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <button class="again" id="again">Watch the film again</button>
      </div>
    </div>
  </div>

  <div class="below" id="below">
    <a class="deck" id="deck" href="/docs/files/Projects_Deck.pdf" target="_blank" rel="noopener">Open the 12-slide deck
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <small id="hint">or open it any time</small>
  </div>

  <p class="foot"><b>Anmol Bhandohal</b> · EE co-op, U of Alberta · available Jan&nbsp;–&nbsp;Aug&nbsp;2027 · <a href="mailto:bhandoha@ualberta.ca">bhandoha@ualberta.ca</a></p>
</main>

<script>
(function(){
  var v = document.getElementById('v'), cover = document.getElementById('cover'), after = document.getElementById('after'),
      s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), below = document.getElementById('below'),
      deck = document.getElementById('deck'), hint = document.getElementById('hint');
  function start(){
    after.hidden = true; cover.hidden = true; below.hidden = false;
    v.controls = true; v.muted = false; v.currentTime = 0;
    s1.className = 'step on'; s1.lastElementChild.textContent = 'Watch the film · 35 s';
    s2.className = 'step'; s2.lastElementChild.textContent = 'Then open the deck';
    deck.classList.remove('go'); hint.textContent = 'or open it any time';
    var p = v.play();
    if (p && p.catch) p.catch(function(){ v.muted = true; v.play().catch(function(){ cover.hidden = false; }); });
  }
  cover.addEventListener('click', start);
  document.getElementById('again').addEventListener('click', start);
  v.addEventListener('ended', function(){
    v.controls = false; after.hidden = false; below.hidden = true;
    s1.className = 'step done'; s1.lastElementChild.textContent = 'Watched the film';
    s2.className = 'step on'; s2.lastElementChild.textContent = 'Open the 12-slide deck';
  });
})();
</script>
</body>
</html>
